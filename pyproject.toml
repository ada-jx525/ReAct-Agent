[project]
name = "react-agent"
version = "0.1.0"
description = "Local customer-support agent with scoped orders, guarded returns and FAISS policy retrieval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langchain-text-splitters>=1.0,<2",
    "sentence-transformers>=5.5,<6",
    "huggingface-hub>=1.0,<2",
    "faiss-cpu>=1.12,<2",
    "numpy>=1.25,<3",
    "torch>=2.13,<3",
    "PyYAML>=6.0.3,<7",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["ruff>=0.16,<1", "build>=1.2,<2", "pytest>=8,<10"]
studio = ["langgraph-cli[inmem]>=0.4,<1"]
openai = ["langchain>=1.3,<2", "langchain-openai>=1.6,<2"]
anthropic = ["langchain>=1.3,<2", "langchain-anthropic>=1.6,<2"]
fireworks = ["langchain>=1.3,<2", "langchain-fireworks>=1.6,<2"]

[build-system]
requires = ["setuptools>=83,<85", "wheel>=0.46,<1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["react_agent*"]
namespaces = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["knowledge/models", "knowledge/index", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
